<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0a4f84" />
  <title>CineSparq — Welcome back</title>

  <!-- App CSS -->
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/components.css" />

  <!-- Minimal system font stack for sleek UI -->
  <style>
    :root { color-scheme: dark; }
  </style>
</head>

<header class="auth__brand">
  <img
    src="./assets/logo/cs-logo-white.svg"
    alt="CineSparq"
    class="brandmark"
  />
</header>

      <div class="authcard" role="region" aria-label="Sign in">
        <div class="authcard__top">
          <h1 class="authcard__title">Welcome back</h1>
          <p class="authcard__caption">Sign in to manage your projects and track your funding path forward.</p>
        </div>

        <form class="form" action="#" method="post" autocomplete="on">
          <label class="field">
            <span class="field__label">Email</span>
            <input class="field__input" type="email" name="email" placeholder="you@studio.com" autocomplete="email" required />
          </label>

          <label class="field">
            <span class="field__label">Password</span>
            <div class="field__row">
              <input id="password" class="field__input" type="password" name="password" placeholder="••••••••••" autocomplete="current-password" required />
              <button class="iconbtn" type="button" data-toggle="password" aria-label="Show password" aria-controls="password">
                <span class="iconbtn__text" data-state="hidden">Show</span>
              </button>
            </div>
          </label>

          <div class="form__meta">
            <label class="check">
              <input type="checkbox" name="remember" />
              <span>Remember me</span>
            </label>

            <a class="link" href="./pages/login.html" aria-label="Forgot password (mock link)">Forgot password?</a>
          </div>

          <button class="btn btn--primary" type="submit">Sign in</button>

          <div class="divider" aria-hidden="true">
            <span class="divider__line"></span>
            <span class="divider__text">or</span>
            <span class="divider__line"></span>
          </div>

          <a class="btn btn--secondary" href="./pages/creator-profile.html">Create account</a>

          <p class="fineprint">
            By continuing, you agree to our
            <a class="link" href="./plain.html">Terms</a>
            and
            <a class="link" href="./plain.html">Privacy</a>.
          </p>
        </form>
      </div>

      <footer class="auth__footer">
  <div class="auth__hint">
    <span>© CineSparq</span>
  </div>
</footer>
    </section>

    <aside class="auth__glow" aria-hidden="true"></aside>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
